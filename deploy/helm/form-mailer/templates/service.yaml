apiVersion: v1
kind: Service
metadata:
  name: {{ include "form-mailer.fullname" . }}
  labels:
    {{- include "form-mailer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "form-mailer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
