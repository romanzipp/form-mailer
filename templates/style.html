{{define "style"}}
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f4f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1f2937;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 32px;
    max-width: 480px;
    width: 100%;
  }
  h1 { font-size: 22px; margin-bottom: 16px; }
  .error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 13px;
    color: #374151;
    margin-bottom: 4px;
    font-weight: 500;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 100px; }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button, .back {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    border: none;
  }
  button { background: #4f46e5; color: #fff; }
  button:hover { background: #4338ca; }
  .back { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
  .back:hover { background: #e5e7eb; }
</style>
{{end}}
